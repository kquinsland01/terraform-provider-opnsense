# Unbound DNS general settings (nested singleton: unbound.general).
# Item resources (host_override, domain_override, acl) remain hand-written.
package: unbound
resources:
  - name: general
    go_type: General
    type_name: unbound_general
    title: the Unbound DNS general settings
    kind: singleton
    id: unbound-general
    custom_resource: true
    reconfigure: /api/unbound/service/reconfigure
    monad: unbound.general
    endpoints:
      get: /api/unbound/settings/get
      set: /api/unbound/settings/set
    fields:
      - {name: Enabled, tf: enabled, json: enabled, type: bool, default: "true", desc: "Enable the Unbound DNS resolver."}
      - {name: Port, tf: port, json: port, type: string, default: "53", desc: "Port the resolver listens on."}
      - {name: Stats, tf: stats, json: stats, type: bool, default: "false", desc: "Collect query statistics."}
      - {name: ActiveInterface, tf: active_interface, json: active_interface, type: selectmaplist, desc: "Interfaces the resolver listens on (empty = all)."}
      - {name: DNSSEC, tf: dnssec, json: dnssec, type: bool, default: "true", desc: "Enable DNSSEC validation."}
      - {name: DNS64, tf: dns64, json: dns64, type: bool, default: "false", desc: "Enable DNS64 synthesis."}
      - {name: DNS64Prefix, tf: dns64_prefix, json: dns64prefix, type: string, default: "", desc: "DNS64 prefix (empty = well-known 64:ff9b::/96)."}
      - {name: NoAAAARecords, tf: no_aaaa_records, json: noarecords, type: bool, default: "false", desc: "Remove A records from responses (legacy attribute name; upstream control is `noarecords`)."}
      - {name: RegisterDHCP, tf: register_dhcp, json: regdhcp, type: bool, default: "false", desc: "Register DHCP leases in the resolver."}
      - {name: RegisterDHCPDomain, tf: register_dhcp_domain, json: regdhcpdomain, type: string, default: "", desc: "Domain appended to registered DHCP names."}
      - {name: RegisterDHCPStatic, tf: register_dhcp_static, json: regdhcpstatic, type: bool, default: "false", desc: "Register static DHCP mappings in the resolver."}
      - {name: NoRegisterLinkLocal6, tf: no_register_link_local6, json: noreglladdr6, type: bool, default: "false", desc: "Do not register IPv6 link-local addresses."}
      - {name: NoRegisterRecords, tf: no_register_records, json: noregrecords, type: bool, default: "false", desc: "Do not register system A/AAAA records."}
      - {name: TXTSupport, tf: txt_support, json: txtsupport, type: bool, default: "false", desc: "Serve TXT records for registered hosts."}
      - {name: CacheFlush, tf: cache_flush, json: cacheflush, type: bool, default: "false", desc: "Flush the DNS cache on reconfigure."}
      - {name: LocalZoneType, tf: local_zone_type, json: local_zone_type, type: selectmap, default: "transparent", desc: "Local zone type (transparent, always_nxdomain, always_refuse, always_transparent, deny)."}
      - {name: OutgoingInterface, tf: outgoing_interface, json: outgoing_interface, type: selectmaplist, desc: "Interfaces used for outgoing queries (empty = all)."}
      - {name: EnableWPAD, tf: enable_wpad, json: enable_wpad, type: bool, default: "false", desc: "Serve WPAD records for proxy auto-discovery."}
      - {name: HideIdentity, tf: hide_identity, json: hideidentity, type: bool, no_default: true, desc: "Refuse id.server and hostname.bind queries."}
      - {name: HideVersion, tf: hide_version, json: hideversion, type: bool, no_default: true, desc: "Refuse version.server and version.bind queries."}
      - {name: EnablePrefetchKey, tf: enable_prefetch_key, json: prefetchkey, type: bool, no_default: true, desc: "Prefetch DNSKEY records during validation."}
      - {name: DNSSECStripped, tf: dnssec_stripped, json: dnssecstripped, type: bool, no_default: true, desc: "Harden against DNSSEC-stripped responses."}
      - {name: AggressiveNSEC, tf: aggressive_nsec, json: aggressivensec, type: bool, no_default: true, desc: "Use aggressive NSEC caching."}
      - {name: QnameMinStrict, tf: qname_min_strict, json: qnameminstrict, type: bool, no_default: true, desc: "Use strict QNAME minimisation."}
      - {name: OutgoingNumTCP, tf: outgoing_num_tcp, json: outgoingnumtcp, type: int, min: 0, desc: "Maximum outgoing TCP buffers per thread."}
      - {name: IncomingNumTCP, tf: incoming_num_tcp, json: incomingnumtcp, type: int, min: 0, desc: "Maximum incoming TCP buffers per thread."}
      - {name: NumQueriesPerThread, tf: num_queries_per_thread, json: numqueriesperthread, type: int, min: 0, desc: "Maximum simultaneous queries per thread."}
      - {name: OutgoingRange, tf: outgoing_range, json: outgoingrange, type: int, min: 0, desc: "Number of ports available to outgoing queries."}
      - {name: JostleTimeout, tf: jostle_timeout, json: jostletimeout, type: int, min: 0, desc: "Timeout in milliseconds for jostled queries."}
      - {name: DiscardTimeout, tf: discard_timeout, json: discardtimeout, type: int, min: 0, desc: "Timeout in milliseconds before discarding queries."}
      - {name: PrivateDomains, tf: private_domains, json: privatedomain, type: csvset, desc: "Domains allowed to contain private addresses."}
      - {name: PrivateAddresses, tf: private_addresses, json: privateaddress, type: csvset, desc: "Private address ranges protected from rebinding."}
      - {name: InsecureDomains, tf: insecure_domains, json: insecuredomain, type: csvset, desc: "Domains excluded from DNSSEC validation."}
      - {name: EnablePrefetch, tf: enable_prefetch, json: prefetch, type: bool, no_default: true, desc: "Prefetch cache entries before expiry."}
      - {name: UnwantedReplyThreshold, tf: unwanted_reply_threshold, json: unwantedreplythreshold, type: int, min: 0, desc: "Threshold for unwanted replies before defensive action."}
      - {name: MsgCacheSize, tf: msg_cache_size, json: msgcachesize, type: string, desc: "Message cache size."}
      - {name: RRSetCacheSize, tf: rrset_cache_size, json: rrsetcachesize, type: string, desc: "RRset cache size."}
      - {name: MaxTTL, tf: max_ttl, json: cachemaxttl, type: int, min: 0, desc: "Maximum cache TTL."}
      - {name: MaxNegativeTTL, tf: max_negative_ttl, json: cachemaxnegativettl, type: int, min: 0, desc: "Maximum negative cache TTL."}
      - {name: MinTTL, tf: min_ttl, json: cacheminttl, type: int, min: 0, desc: "Minimum cache TTL."}
      - {name: HostTTL, tf: host_ttl, json: infrahostttl, type: int, min: 0, desc: "Infrastructure host cache TTL."}
      - {name: KeepProbingHosts, tf: keep_probing_hosts, json: infrakeepprobing, type: bool, no_default: true, desc: "Keep probing hosts that are down."}
      - {name: NumHosts, tf: num_hosts, json: infracachenumhosts, type: int, min: 0, desc: "Infrastructure host cache size."}
      - {name: ExtendedStatistics, tf: extended_statistics, json: extendedstatistics, type: bool, no_default: true, desc: "Collect extended statistics."}
      - {name: LogQueries, tf: log_queries, json: logqueries, type: bool, no_default: true, desc: "Log queries."}
      - {name: LogReplies, tf: log_replies, json: logreplies, type: bool, no_default: true, desc: "Log replies."}
      - {name: TagQueryReply, tf: tag_query_reply, json: logtagqueryreply, type: bool, no_default: true, desc: "Tag query and reply log lines."}
      - {name: LogLocalActions, tf: log_local_actions, json: loglocalactions, type: bool, no_default: true, desc: "Log local-zone actions."}
      - {name: LogServfail, tf: log_servfail, json: logservfail, type: bool, no_default: true, desc: "Log SERVFAIL responses."}
      - {name: VerbosityLevel, tf: verbosity_level, json: logverbosity, type: int, min: 0, max: 5, desc: "Unbound log verbosity level."}
      - {name: ValidationLevel, tf: validation_level, json: valloglevel, type: int, min: 0, max: 2, desc: "DNSSEC validation log level."}
      - {name: ServeExpiredEnabled, tf: serve_expired_enabled, json: serveexpired, type: bool, no_default: true, desc: "Serve expired records while refreshing."}
      - {name: ServeExpiredRecordReplyTTL, tf: serve_expired_record_reply_ttl, json: serveexpiredreplyttl, type: string, desc: "TTL returned for expired records."}
      - {name: ServeExpiredTTL, tf: serve_expired_ttl, json: serveexpiredttl, type: string, desc: "Maximum time to serve expired records."}
      - {name: ServeExpiredResetTTL, tf: serve_expired_reset_ttl, json: serveexpiredttlreset, type: bool, no_default: true, desc: "Reset an expired record's TTL after reply."}
      - {name: ServeExpiredClientResponseTimeout, tf: serve_expired_client_response_timeout, json: serveexpiredclienttimeout, type: string, desc: "Client response timeout before serving expired data."}
      - {name: ACLDefaultAction, tf: acl_default_action, json: default_action, type: selectmap, options: [allow, deny, refuse], desc: "Default action for clients not matched by an ACL."}
      - {name: ForwardingEnabled, tf: forwarding_enabled, json: forwarding_enabled, type: bool, no_default: true, desc: "Enable query forwarding."}

  - name: dnsbl
    go_type: DNSBL
    type_name: unbound_dnsbl
    title: the Unbound DNS blocklist (DNSBL) settings
    kind: singleton
    id: unbound-dnsbl
    custom_resource: true
    reconfigure: /api/unbound/service/reconfigure
    monad: unbound.dnsbl
    endpoints:
      get: /api/unbound/settings/get
      set: /api/unbound/settings/set
    fields:
      - {name: Enabled, tf: enabled, json: enabled, type: bool, default: "false", desc: "Enable DNS-based blocklisting."}
      - {name: SafeSearch, tf: safe_search, json: safesearch, type: bool, default: "false", desc: "Force safe search on supported search engines."}
      - {name: Type, tf: type, json: type, type: selectmaplist, desc: "Built-in blocklist feeds to enable."}
      - {name: Lists, tf: lists, json: lists, type: selectmaplist, desc: "Custom blocklist URL entries to apply."}
      - {name: Whitelists, tf: whitelists, json: whitelists, type: selectmaplist, desc: "Whitelist (allow) domain pattern entries."}
      - {name: Blocklists, tf: blocklists, json: blocklists, type: selectmaplist, desc: "Blocklist (deny) domain pattern entries."}
      - {name: Wildcards, tf: wildcards, json: wildcards, type: selectmaplist, desc: "Wildcard domain block entries."}
      - {name: Address, tf: address, json: address, type: string, default: "", desc: "Destination address for blocked responses (empty = 0.0.0.0)."}
      - {name: NXDomain, tf: nxdomain, json: nxdomain, type: bool, default: "false", desc: "Return NXDOMAIN for blocked entries instead of an address."}
