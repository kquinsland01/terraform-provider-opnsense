# Kea DHCP control agent settings (nested singleton: ctrlagent.general). Core module.
package: kea
resources:
  - name: ctrl_agent
    go_type: CtrlAgent
    type_name: kea_ctrl_agent
    title: the Kea DHCP control agent settings
    kind: singleton
    id: kea-ctrl-agent
    reconfigure: /api/kea/service/reconfigure
    monad: ctrlagent.general
    endpoints:
      get: /api/kea/ctrl_agent/get
      set: /api/kea/ctrl_agent/set
    fields:
      - {name: Enabled, tf: enabled, json: enabled, type: bool, default: "false", desc: "Enable the Kea control agent (required for HA and the dashboard)."}
      - {name: HTTPHost, tf: http_host, json: http_host, type: string, default: "127.0.0.1", desc: "Address the control agent listens on."}
      - {name: HTTPPort, tf: http_port, json: http_port, type: string, default: "8000", desc: "Port the control agent listens on."}

  - name: dhcpv6_settings
    go_type: DHCPv6Settings
    type_name: kea_dhcpv6_settings
    title: the Kea DHCPv6 general settings
    kind: singleton
    id: kea-dhcpv6
    reconfigure: /api/kea/service/reconfigure
    monad: dhcpv6.general
    endpoints:
      get: /api/kea/dhcpv6/get
      set: /api/kea/dhcpv6/set
    fields:
      - {name: Enabled, tf: enabled, json: enabled, type: bool, default: "false", desc: "Enable the Kea DHCPv6 server."}
      - {name: ManualConfig, tf: manual_config, json: manual_config, type: bool, default: "false", desc: "Manage the Kea config file manually (disable GUI management)."}
      - {name: Interfaces, tf: interfaces, json: interfaces, type: selectmaplist, desc: "Interfaces the DHCPv6 server listens on."}
      - {name: ValidLifetime, tf: valid_lifetime, json: valid_lifetime, type: int, default: "4000", desc: "Default lease valid lifetime in seconds."}
      - {name: FirewallRules, tf: firewall_rules, json: fwrules, type: bool, default: "true", desc: "Automatically add firewall rules for the service."}
      - {name: DHCPSocketType, tf: dhcp_socket_type, json: dhcp_socket_type, type: selectmap, default: "raw", desc: "DHCP socket type: raw or udp."}

  - name: dhcpv4_settings
    go_type: DHCPv4Settings
    type_name: kea_dhcpv4_settings
    title: the Kea DHCPv4 general settings
    kind: singleton
    id: kea-dhcpv4
    reconfigure: /api/kea/service/reconfigure
    monad: dhcpv4.general
    endpoints:
      get: /api/kea/dhcpv4/get
      set: /api/kea/dhcpv4/set
    fields:
      - {name: Enabled, tf: enabled, json: enabled, type: bool, default: "false", desc: "Enable the Kea DHCPv4 server."}
      - {name: ManualConfig, tf: manual_config, json: manual_config, type: bool, default: "false", desc: "Manage the Kea config file manually (disable GUI management)."}
      - {name: Interfaces, tf: interfaces, json: interfaces, type: selectmaplist, desc: "Interfaces the DHCPv4 server listens on."}
      - {name: ValidLifetime, tf: valid_lifetime, json: valid_lifetime, type: int, default: "4000", desc: "Default lease valid lifetime in seconds."}
      - {name: FirewallRules, tf: firewall_rules, json: fwrules, type: bool, default: "true", desc: "Automatically add firewall rules for the service."}
      - {name: DHCPSocketType, tf: dhcp_socket_type, json: dhcp_socket_type, type: selectmap, default: "raw", desc: "DHCP socket type: raw or udp."}

  - name: ha_peer
    go_type: HAPeer
    type_name: kea_ha_peer
    title: a Kea High Availability peer
    kind: item
    reconfigure: /api/kea/service/reconfigure
    monad: peer
    endpoints:
      add: /api/kea/dhcpv4/addPeer
      get: /api/kea/dhcpv4/getPeer
      set: /api/kea/dhcpv4/setPeer
      del: /api/kea/dhcpv4/delPeer
      search: /api/kea/dhcpv4/searchPeer
    fields:
      - {name: Name, tf: name, json: name, type: string, required: true, test_value: '"tfaccpeer"', desc: "Unique name of the HA peer (must match the server name)."}
      - {name: Role, tf: role, json: role, type: selectmap, default: "primary", desc: "HA role: primary or standby."}
      - {name: URL, tf: url, json: url, type: string, required: true, test_value: '"http://192.0.2.5:8000/"', desc: "Control-agent URL of the peer."}

  - name: dhcpv6_peer
    go_type: DHCPv6Peer
    type_name: kea_dhcpv6_peer
    title: a Kea DHCPv6 High Availability peer
    kind: item
    recover_create: true
    pending_activation: true
    strict_delete_response: true
    strict_missing_object_response: true
    minimum_version: "26.7.7"
    composite_destroy: checkKeaGeneratedPeerCleanup(t)
    unique_test: true
    response_validator: validateDHCPv6PeerResponse(m)
    test_precheck: keaParityGeneratedPreCheck(t)
    reconfigure: /api/kea/service/reconfigure
    monad: peer
    endpoints:
      add: /api/kea/dhcpv6/add_peer
      get: /api/kea/dhcpv6/get_peer
      set: /api/kea/dhcpv6/set_peer
      del: /api/kea/dhcpv6/del_peer
      search: /api/kea/dhcpv6/search_peer
    fields:
      - {name: Name, tf: name, json: name, type: string, required: true, test_value: '"tfaccpeer6-%[1]s"', update_test_value: '"tfaccpeer6-updated-%[1]s"', desc: "Unique DHCPv6 HA peer name."}
      - {name: Role, tf: role, json: role, type: selectmap, response_type: strict_selectmap, default: "primary", static_default: true, options: [primary, standby], test_value: '"primary"', update_test_value: '"standby"', desc: "DHCPv6 HA role: primary or standby; defaults to primary."}
      - {name: URL, tf: url, json: url, type: string, required: true, test_value: '"http://[2001:db8::5]:8000/"', update_test_value: '"http://[2001:db8::6]:8000/"', desc: "Control-agent URL of the DHCPv6 peer."}

  - name: dhcpv6_pd_pool
    go_type: DHCPv6PDPool
    type_name: kea_dhcpv6_pd_pool
    title: a Kea DHCPv6 delegated-prefix pool
    kind: item
    recover_create: true
    pending_activation: true
    strict_delete_response: true
    strict_missing_object_response: true
    minimum_version: "26.7.7"
    composite_destroy: checkKeaGeneratedPDPoolCleanup(t)
    resource_from_api: fromAPIResource
    unique_test: true
    response_validator: validateDHCPv6PDPoolResponse(m)
    test_precheck: keaParityGeneratedPreCheck(t)
    reconfigure: /api/kea/service/reconfigure
    monad: pd_pool
    test_prereq: |
      resource "opnsense_kea_dhcpv6_subnet" "pd_parent" {
        subnet     = "fd32:%[3]x::/48"
        interface  = %[2]q
      }
    endpoints:
      add: /api/kea/dhcpv6/add_pd_pool
      get: /api/kea/dhcpv6/get_pd_pool
      set: /api/kea/dhcpv6/set_pd_pool
      del: /api/kea/dhcpv6/del_pd_pool
      search: /api/kea/dhcpv6/search_pd_pool
    fields:
      - {name: SubnetID, tf: subnet_id, json: subnet, type: string, response_type: strict_selectmap, required: true, test_value: 'opnsense_kea_dhcpv6_subnet.pd_parent.id', desc: "UUID of the parent Kea DHCPv6 subnet."}
      - {name: Prefix, tf: prefix, json: prefix, type: string, required: true, normalize_cidr_to_address: true, preserve_equivalent_cidr: true, test_value: '"fd32:%[3]x::/48"', desc: "Aligned IPv6 aggregate prefix address or CIDR prefix.", data_source_desc: "Aligned IPv6 aggregate prefix address exactly as returned by the API (address-only, without CIDR suffix)."}
      - {name: PrefixLength, tf: prefix_len, json: prefix_len, type: int, required: true, min: 1, max: 128, strict_response: true, test_value: '48', desc: "Length of the aggregate prefix."}
      - {name: DelegatedLength, tf: delegated_len, json: delegated_len, type: int, required: true, min: 1, max: 128, strict_response: true, test_value: '64', update_test_value: '80', desc: "Length delegated to each client; must be longer than prefix_len."}
      - {name: Description, tf: description, json: description, type: string, omit_unknown: true, test_value: '"Story31b-generated-%[1]s-pd"', update_test_value: '"Story31b-generated-%[1]s-pd-updated"', desc: "Description of the delegated-prefix pool."}
